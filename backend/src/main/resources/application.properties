spring.application.name=employee-management-system
server.port=8080

# ---- Database (MySQL) ----
# Override with environment variables; no code change needed.
# createDatabaseIfNotExist=true lets the app create `ems_db` itself if it is missing.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ems_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# `update` creates/updates the table automatically. database/schema.sql is the equivalent manual script.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---- CORS (only needed when the frontend is served from another origin) ----
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# ---- Swagger / OpenAPI ----
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.api-docs.path=/v3/api-docs
