# Used by the integration test only: an in-memory H2 database in MySQL-compatibility mode.
spring.datasource.url=jdbc:h2:mem:emstest;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
