# One command to run everything:   docker compose up --build
#   Frontend  http://localhost:5173
#   API       http://localhost:8080        Swagger UI  http://localhost:8080/swagger-ui.html
#   MySQL     localhost:3307 (user root / password root) - 3307 so it never clashes with a local MySQL on 3306

services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ems_db
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      # Scripts in this folder run automatically the first time the database volume is created.
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    environment:
      DB_URL: "jdbc:mysql://db:3306/ems_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      DB_USERNAME: root
      DB_PASSWORD: root
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  db_data:
